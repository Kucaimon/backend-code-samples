[project]
name = "concierge-mvp"
version = "0.1.0"
description = "Concierge service MVP: guest communication for property management companies (Stage 1)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.5",
    "apscheduler>=3.10",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["aiosqlite>=0.20", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
